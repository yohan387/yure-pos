name: todouapp
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.17.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.3.3
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  flutter_svg: ^2.1.0
  flutter_native_splash: ^2.3.7
  flutter_launcher_icons: "^0.13.1"
  internet_connection_checker: ^1.0.0+1
  dartz: ^0.10.1
  flutter_secure_storage: ^9.0.0
  http: ^1.4.0
  flutter_appauth: ^6.0.2
  jwt_decode: ^0.3.1
  connectivity_plus: ^6.1.4
  get_it: ^8.0.3
  flutter_spinkit: ^5.2.1
  pin_code_fields: ^8.0.1
  event_bus: ^2.0.1
  flutter_stripe: ^11.5.0
  country_list_pick: ^1.0.1+6
  qr_flutter: ^4.1.0
  lottie: ^3.3.1
  share_plus: ^11.0.0
  path_provider: ^2.1.2
  screenshot: ^3.0.0
  flutter_dotenv: ^5.2.1
  mek_stripe_terminal: ^3.7.0
  permission_handler: ^12.0.0+1
  rive: ^0.13.20
  awesome_dialog: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^9.1.4
  mocktail: ^0.3.0

flutter_native_splash:
  color: "#FEECE7"
  android: true
  image: assets/images/logo.png
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FEECE7"
  image_path: "assets/images/logo.png"

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/animations/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
