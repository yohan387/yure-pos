plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.todouapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // dependencies {  
    //     implementation("com.stripe:stripeterminal:4.5.0")}

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.todouapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 33
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            appAuthRedirectScheme: 'com.example.todouapp', // Replace with your reverse domain
            applicationName: 'android.app.Application'
        ]
    }

    buildTypes {
       release {
        signingConfig = signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
       }
    }
    configurations { 
        all*.exclude module: 'bcprov-jdk15to18'
     } 
    packagingOptions { 
        exclude 'org/bouncycastle/x509/*.properties'
    } 
}

flutter {
    source = "../.."
}
